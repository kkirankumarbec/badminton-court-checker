name: Badminton Court Availability Check

on:
  schedule:
    - cron: '30 6 * * *'   # 12:00 PM IST - alert-only (emails only if <=2 courts left)
    - cron: '30 7 * * *'   # 1:00 PM IST  - full availability report
    - cron: '30 11 * * *'  # 5:00 PM IST  - full availability report
  workflow_dispatch:
    inputs:
      mode:
        description: "alert (only emails on low availability) or report (always emails)"
        required: false
        default: "report"

permissions:
  contents: read

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check court availability
        env:
          MODE: ${{ github.event.schedule == '30 6 * * *' && 'alert' || (github.event.inputs.mode || 'report') }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python check_availability.py
