name: Badminton Court Availability Check

on:
  schedule:
    # Hourly, offset a few minutes past the hour. GitHub Actions' native
    # schedule trigger does not reliably honor sub-hourly cron intervals
    # (observed ~2-6hr real gaps when this was set to */15) - hourly, off
    # the exact hour to dodge top-of-hour queueing, is the most reliable
    # cadence achievable without an external trigger. See README for how
    # to add one (e.g. cron-job.org) if true 15-min freshness is needed.
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: badminton-court-checker
  cancel-in-progress: false

jobs:
  check-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check court availability
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          python check_availability.py

      - name: Publish updated page and alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html alert_state.json
          git diff --cached --quiet || git commit -m "Update availability page"
          git push
